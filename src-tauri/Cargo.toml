[package]
name = "activityui"
version = "0.2.0"
description = "Desktop shell for ActivityUI"
authors = ["ActivityUI"]
edition = "2021"

[lib]
name = "activityui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
